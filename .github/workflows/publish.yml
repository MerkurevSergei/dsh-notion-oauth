name: Publish

# Stages a release on npm through Trusted Publishing. Nothing secret is stored
# in the repository or in GitHub secrets: npm trusts this repository + workflow
# over OIDC, issues a short-lived credential, and the staged version carries a
# provenance attestation.
#
# Staging deliberately defers the human approval — the version only becomes
# public once a maintainer approves it (npmjs.com: the package's staged versions,
# or `npm stage approve <stage-id>`).
#
# One-time setup on npmjs.com — package page → Settings → Trusted Publisher:
#   Publisher:          GitHub Actions
#   Organization/user:  MerkurevSergei
#   Repository:         dsh-notion-oauth-ui
#   Workflow filename:  publish.yml
#   Environment:        (leave empty)
#   Permissions:        Allow staged publish
#
# Releasing = bump the version, push, publish a GitHub Release with the matching
# tag (vX.Y.Z), then approve the staged version.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for a publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted Publishing needs npm >= 11.5.1 and `npm stage` needs npm >= 11.6.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Verify build output
        run: test -f lib/index.js && test -f lib/client.js

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          actual="${{ github.event.release.tag_name }}"
          if [ "$expected" != "$actual" ]; then
            echo "Release tag $actual does not match package.json ($expected)"
            exit 1
          fi

      # Idempotency: re-running this workflow, or publishing a release for a
      # version that is already on the registry, must not fail.
      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage the release
        if: steps.version.outputs.exists == 'false'
        run: npm stage publish
